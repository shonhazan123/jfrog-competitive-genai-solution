# Every LLM call the system makes, one block per call, so each can be tuned
# independently. Values under `defaults` apply to every call unless the call
# overrides them. A model name can also be overridden at runtime with the
# ROLES_<CALL> environment variable (e.g. ROLES_EXTRACT=gpt-5).
#
# Fields (all optional except `model`):
#   model             OpenAI model name.
#   temperature       Sampling temperature. Set to null to use the model
#                     default — reasoning models such as gpt-5 only accept
#                     their default temperature.
#   timeout_seconds   Per-request timeout, in seconds.
#   max_retries       Automatic retries on transient errors.
#   max_tokens        Cap on generated tokens (null = model default).
#   reasoning_effort  minimal | low | medium | high, for reasoning models only
#                     (null leaves it unset).

defaults:
  provider: openai
  temperature: 0
  timeout_seconds: 60
  max_retries: 2
  max_tokens: null
  reasoning_effort: null

calls:
  # Research graphs — relevance/usable gate over search hits or structured material.
  # Cheap, fast, schema-locked structured output per box.
  gate:
    description: >-
      Per-box relevance gate for Industry, Signals, and Comparison research graphs.
      Keeps on-topic hits or marks absent; never fabricates.
    model: gpt-5-mini
    temperature: 0
    timeout_seconds: 45
    reasoning_effort: low

  # Research graphs — heavier synthesis when a gate resolves (optional tier).
  synthesize:
    description: >-
      Optional synthesis pass for research findings when the graph needs richer
      card text beyond the gate verdict.
    model: gpt-5-mini
    temperature: 0
    timeout_seconds: 90
    reasoning_effort: low

  # Ask endpoint — answers analyst questions strictly from retrieved ledger
  # evidence and refuses when the answer is not supported. Read-only.
  ask:
    description: >-
      Answers grounded questions over retrieved evidence and refuses when the
      evidence does not support an answer.
    model: gpt-5
    temperature: 0
    reasoning_effort: null

  # Chat agent — planner. Reads the user turn + recent window and emits a JSON
  # plan (expanded query + ordered retrieve steps). Deterministic, structured.
  # Planning is a light structured task, not a reasoning problem: a full gpt-5
  # reasoning pass here cost ~15-45s per request. gpt-5-mini + minimal reasoning
  # keeps it fast while still resolving pronouns and decomposing steps.
  chat_plan:
    description: >-
      Plans a chat run: restates the user's question with context resolved and
      emits ordered retrieve steps. Never answers or invents facts.
    model: gpt-5-mini
    temperature: 0
    reasoning_effort: minimal

  # Chat agent — drafter. Assembles a grounded answer using ONLY retrieved
  # evidence and refuses when the evidence does not support an answer. Extractive
  # synthesis over supplied evidence does not need heavy reasoning; gpt-5-mini
  # (low) answers fast and streams.
  chat_draft:
    description: >-
      Writes a grounded, cited answer strictly from retrieved evidence, or
      refuses. Extractive-only; introduces no unretrieved material.
    model: gpt-5-mini
    temperature: 0
    reasoning_effort: low
