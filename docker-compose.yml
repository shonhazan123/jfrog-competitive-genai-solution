# JFrog Competitive Intelligence — local demo
#
# Start everything (db + api + worker + client):
#   docker compose up --build
#
# Stop:
#   docker compose down        (or Ctrl+C if running in the foreground)
#
# UI:  http://localhost:5173
# API: http://localhost:8000/health
#
# The app boots with NO setup — the site starts empty and instructs you to
# click "Run now". To let "Run now" gather live data, add your OpenAI key to a
# .env file (see .env.example). The .env file is OPTIONAL: the stack still
# starts without it.
#
# Do not run `npm run dev` inside client/ separately — the client container
# above is the only UI you need. A local Vite on :5173 will shadow Docker.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # .env is optional — the stack starts without it (Run now needs OPENAI_API_KEY).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ci:ci@db:5432/ci
      PYTHONPATH: /app
    volumes:
      - ./config:/app/config:ro
      - blobs:/app/data/blobs
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: ./backend
    command: python -m worker.main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ci:ci@db:5432/ci
      BACKFILL_SOURCE: fixtures
    volumes:
      - ./config:/app/config:ro
      - blobs:/app/data/blobs
      - ./fixtures/wayback:/app/fixtures/wayback
    depends_on:
      db: { condition: service_healthy }
  client:
    build: ./client
    command: npm run dev
    environment:
      VITE_API_MODE: live
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
  blobs:
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
