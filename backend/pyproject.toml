[project]
name = "jfrog-ci"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.52,<0.53",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.19,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "httpx>=0.28,<0.29",
  "protego>=0.6,<1",
  "pyrate-limiter>=4.4,<5",
  "tenacity>=9.1,<10",
  "feedparser>=6.0.14,<7",
  "selectolax>=0.4.11,<0.5",
  "trafilatura>=2.2,<3",
  "ftfy>=6.3,<7",
  "dateparser>=1.4,<2",
  "rapidfuzz>=3.14,<4",
  "pyyaml>=6.0.3,<7",
  "structlog>=26.1,<27",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-openai>=1.6,<2",
  "openai>=3.3,<4",
  "tiktoken>=0.14,<0.15",
  "nh3>=0.3,<0.4",
  "apscheduler>=3.11,<4",
]
[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "testcontainers[postgres]>=4.15,<5",
  "respx>=0.23,<0.24",
  "ruff>=0.16,<0.17",
]
[tool.pytest.ini_options]
testpaths = ["../tests"]
markers = ["live: touches the network; excluded by default"]
addopts = "-m 'not live'"
